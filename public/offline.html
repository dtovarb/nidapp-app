<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#9b5de5">
<title>Sin conexión · NIDAPP</title>
<style>
  html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#fff8e8;color:#202036}
  main{min-height:100vh;display:grid;place-items:center;padding:16px}
  .card{max-width:380px;width:100%;background:#fffdf5;border:4px solid #282846;border-radius:20px;padding:24px;text-align:center;box-shadow:9px 9px 0 rgba(40,40,70,.18)}
  img{width:72px;height:72px}
  h1{font-size:20px;margin:12px 0 6px}
  p{margin:0 0 16px;color:#5e5a72}
  button{border:3px solid #282846;background:#62c76f;color:#202036;padding:10px 16px;border-radius:10px;font-weight:900;font-size:15px;cursor:pointer}
</style>
</head>
<body>
<main><div class="card">
  <img src="/icons/icon-192.png" alt="">
  <h1>Estás sin conexión</h1>
  <p>NIDAPP necesita internet para mostrar los datos de tu residencia. Revisá tu conexión y volvé a intentar.</p>
  <button onclick="location.reload()">Reintentar</button>
</div></main>
</body>
</html>
